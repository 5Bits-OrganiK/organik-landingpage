<header class="site-header">
  <nav class="nav-container" aria-label="Primary navigation">
    <a class="brand" href="#home" (click)="closeMenu()">
      <img src="/assets/images/brand/logo-organik.png" alt="OrganiK logo" />
      <span>OrganiK</span>
    </a>

    <button class="nav-toggle" type="button" [attr.aria-expanded]="isOpen()" aria-label="Abrir menu" (click)="toggleMenu()">
      <span></span><span></span><span></span>
    </button>

    <div class="nav-panel" [class.nav-panel--open]="isOpen()">
      @for (item of navItems; track item.href) {
        <a [href]="item.href" (click)="closeMenu()">{{ item.label | translate }}</a>
      }
      <app-language-switcher />
      <a class="access-button" href="#starter" (click)="closeMenu()">{{ 'nav.access' | translate }}</a>
    </div>
  </nav>
</header>
